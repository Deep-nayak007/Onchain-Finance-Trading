# Deploy file (added by Brain; indexer logic untouched). Hasura GraphQL in front of the self-hosted Envio Postgres.
# Image/env follow Envio's official example: github.com/enviodev/local-docker-example (docker-compose.yaml).
#   fly deploy --config indexer/deploy/fly.graphql.toml
# Secrets (set via fly, never committed): HASURA_GRAPHQL_DATABASE_URL (fly postgres attach), HASURA_GRAPHQL_ADMIN_SECRET.
app = "leash-envio-graphql"
primary_region = "lax"

[build]
  image = "hasura/graphql-engine:v2.43.0"

[env]
  HASURA_GRAPHQL_ENABLE_CONSOLE = "false"
  HASURA_GRAPHQL_UNAUTHORIZED_ROLE = "public"
  HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES = "true"
  HASURA_GRAPHQL_NO_OF_RETRIES = "10"
  HASURA_GRAPHQL_ENABLED_LOG_TYPES = "startup, http-log, webhook-log, websocket-log"
  HASURA_GRAPHQL_SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
