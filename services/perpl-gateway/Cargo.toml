[package]
name = "perpl-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "LEASH Perpl execution gateway: reads cached exchange state, prepares and signs trade-only orders, and fails closed on unsafe executes."

[dependencies]
# Perpl SDK: in-memory exchange cache + order preparation (execOrdersV2 calldata).
perpl-sdk = { version = "0.2", default-features = false, features = ["display"] }
alloy = { version = "2.5", default-features = false, features = [
  "contract",
  "eips",
  "provider-http",
  "reqwest",
  "reqwest-rustls-tls",
  "rpc",
  "rpc-client",
  "rpc-types",
  "signer-local",
  "signer-keystore",
  "network",
] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fastnum = "0.7"
futures = "0.3"
rand = "0.8"
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
