# Fly.io config for the Brain API. Deploy from the repo root (build context must include packages/shared):
#   fly deploy . --config services/api/fly.toml
app = "leash-brain-api"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"   # relative to this file; build context is the repo root

[env]
  PORT = "8787"
  DATABASE_PATH = "/data/leash.db"
  CHAIN_ID = "10143"
  LIVE = "false"
  MAX_ORDER_USD = "25"

[mounts]
  source = "leash_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # One always-on machine: the agent loops run in-process and SQLite lives on one volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "45s"   # tsx compiles TypeScript on boot (~10-15s)
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
