# Keeps the free Render services (and the Perpl snapshot cache) warm: Render free instances sleep after 15 min idle.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://leash-brain-api.onrender.com/health https://leash-perpl-gateway-testnet.onrender.com/health https://leash-gateway.onrender.com/health; do
            curl -s -m 90 -o /dev/null -w "$u %{http_code}\n" "$u" || true
          done
